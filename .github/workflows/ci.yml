name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"
      - name: Install canonical Python environment
        run: |
          python -m pip install --require-hashes --upgrade -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Initialize reports
        run: mkdir -p reports
      - name: Record environment identity
        run: python scripts/measure_command.py --environment-report reports/environment.json -- python --version
      - name: Compile
        run: python scripts/measure_command.py --gate compileall --report reports/ci-gates.jsonl -- python -m compileall -q src tests scripts
      - name: Unit tests
        run: python scripts/measure_command.py --gate unittest --report reports/ci-gates.jsonl -- python -m unittest discover -s tests -v
      - name: Pytest
        run: python scripts/measure_command.py --gate pytest --report reports/ci-gates.jsonl -- python -m pytest -q -p no:cacheprovider
      - name: Retrieval evaluation
        run: python scripts/measure_command.py --gate retrieval_evaluation --report reports/ci-gates.jsonl -- python scripts/evaluate_uud_retrieval.py --strict-known-gaps
      - name: Artifact validation
        run: python scripts/measure_command.py --gate artifact_validate --report reports/ci-gates.jsonl -- python -m tjipto.corpora.uud_artifact_baseline validate
      - name: Artifact rebuild
        run: python scripts/measure_command.py --gate artifact_rebuild --report reports/ci-gates.jsonl -- python -m tjipto.corpora.uud_artifact_baseline rebuild
      - name: Ruff
        run: python scripts/measure_command.py --gate ruff --report reports/ci-gates.jsonl -- ruff check src tests scripts
      - name: MyPy
        run: python scripts/measure_command.py --gate mypy --report reports/ci-gates.jsonl -- mypy src
      - name: Bandit
        run: python scripts/measure_command.py --gate bandit --report reports/ci-gates.jsonl -- bandit -q -r src
      - name: pip check
        run: python scripts/measure_command.py --gate pip_check --report reports/ci-gates.jsonl -- python -m pip check
      - name: pip audit
        run: python -m pip_audit --strict -r requirements.lock -f json -o reports/pip-audit.json
      - name: Dependency inspection
        run: python -m pip inspect > reports/pip-inspect.json
      - name: Clean tree after rebuild
        run: python scripts/measure_command.py --gate clean_tree --report reports/ci-gates.jsonl -- git diff --exit-code
      - name: Verify exact archive (first build)
        run: python scripts/measure_command.py --gate release_validation --report reports/ci-gates.jsonl -- bash -c 'python scripts/verify_clean_handoff.py release "$GITHUB_SHA" "$RUNNER_TEMP/tjipto-release-one.zip" > reports/release-one.json && cp "$RUNNER_TEMP/tjipto-release-one.zip.sidecar.json" reports/release-one.sidecar.json'
      - name: Verify exact archive (second build)
        run: python scripts/measure_command.py --gate release_validation --report reports/ci-gates.jsonl -- bash -c 'python scripts/verify_clean_handoff.py release "$GITHUB_SHA" "$RUNNER_TEMP/tjipto-release-two.zip" > reports/release-two.json && cp "$RUNNER_TEMP/tjipto-release-two.zip.sidecar.json" reports/release-two.sidecar.json'
      - name: Compare release identities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          first = json.loads(Path("reports/release-one.json").read_text())
          second = json.loads(Path("reports/release-two.json").read_text())
          first_sidecar = json.loads(Path(first["sidecar_path"]).read_text())
          second_sidecar = json.loads(Path(second["sidecar_path"]).read_text())
          comparison = {
              "archive_sha256_equal": first["archive_sha256"] == second["archive_sha256"],
              "artifact_set_digest_equal": first_sidecar["artifact_set_digest"] == second_sidecar["artifact_set_digest"],
              "first_archive_sha256": first["archive_sha256"],
              "second_archive_sha256": second["archive_sha256"],
              "artifact_set_digest": first_sidecar["artifact_set_digest"],
          }
          Path("reports/release-comparison.json").write_text(json.dumps(comparison, indent=2, sort_keys=True) + "\n")
          if not all(comparison[key] for key in ("archive_sha256_equal", "artifact_set_digest_equal")):
              raise SystemExit("release reproducibility comparison failed")
          PY
      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-evidence
          path: reports/
          if-no-files-found: error

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install canonical Python environment for smoke
        working-directory: .
        run: |
          python -m pip install --require-hashes --upgrade -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Initialize reports
        run: mkdir -p reports
      - name: Clean install
        run: npm ci
      - name: Unit tests
        run: python ../../scripts/measure_command.py --gate web_test --report reports/ci-gates.jsonl -- npm run test
      - name: Lint
        run: python ../../scripts/measure_command.py --gate web_lint --report reports/ci-gates.jsonl -- npm run lint
      - name: Typecheck
        run: python ../../scripts/measure_command.py --gate web_typecheck --report reports/ci-gates.jsonl -- npm run typecheck
      - name: Clean build
        run: python ../../scripts/measure_command.py --gate web_build --report reports/ci-gates.jsonl -- npm run build
      - name: Production audit
        run: npm audit --omit=dev --audit-level=high --json > npm-audit.json
      - name: Install browser
        run: npm run smoke:install
      - name: Smoke test
        run: python ../../scripts/measure_command.py --gate web_smoke --report reports/ci-gates.jsonl -- npm run smoke
      - name: Record web environment
        if: always()
        run: |
          node --version > node-version.txt
          npm --version > npm-version.txt
          sha256sum package-lock.json > package-lock.sha256
          node -e "const b=require('./node_modules/playwright-core/browsers.json').browsers.find((x)=>x.name==='chromium'); console.log(JSON.stringify(b))" > browser.json
          printf '{"runner_image_os":"%s","runner_image_version":"%s"}\n' "$ImageOS" "$ImageVersion" > environment.json
      - name: Upload web evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-evidence
          path: |
            apps/web/npm-audit.json
            apps/web/node-version.txt
            apps/web/npm-version.txt
            apps/web/package-lock.sha256
            apps/web/environment.json
            apps/web/browser.json
            apps/web/reports/ci-gates.jsonl
          if-no-files-found: warn
