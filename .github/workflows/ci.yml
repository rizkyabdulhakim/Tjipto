name: CI

on:
  pull_request:
  push:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python -m compileall -q src tests scripts
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python -m pytest -q -p no:cacheprovider
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src:.
      - run: python scripts/evaluate_uud_retrieval.py --strict-known-gaps
      - run: python -m tjipto.corpora.uud_artifact_baseline validate
        env:
          PYTHONPATH: src
      - run: python -m tjipto.corpora.uud_artifact_baseline rebuild
        env:
          PYTHONPATH: src
      - run: git diff --exit-code
      - name: Verify clean archive
        run: |
          git archive --format=zip --worktree-attributes HEAD -o tjipto-clean.zip
          python scripts/verify_clean_handoff.py tjipto-clean.zip
          mkdir tjipto-clean
          unzip -q tjipto-clean.zip -d tjipto-clean
          python scripts/verify_clean_handoff.py tjipto-clean
          cd tjipto-clean
          python -m compileall -q src tests scripts
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=src python -m unittest discover -s tests -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev
      - run: npm run smoke:install
      - run: npm run smoke
