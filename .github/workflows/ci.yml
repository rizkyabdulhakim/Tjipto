name: CI

on:
  pull_request:
  push:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]" pytest
      - run: python -m compileall -q src tests
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python -m pytest -q
        env:
          PYTHONPATH: src:.
      - run: python -m tjipto.corpora.uud_artifact_baseline validate
        env:
          PYTHONPATH: src
      - run: python -m tjipto.corpora.uud_artifact_baseline rebuild
        env:
          PYTHONPATH: src
      - run: git diff --exit-code
      - name: Verify clean archive
        run: |
          git archive --format=zip --worktree-attributes HEAD -o tjipto-clean.zip
          python scripts/verify_clean_handoff.py tjipto-clean.zip
          mkdir tjipto-clean
          unzip -q tjipto-clean.zip -d tjipto-clean
          python scripts/verify_clean_handoff.py tjipto-clean
          cd tjipto-clean
          python -m compileall -q src tests
          PYTHONPATH=src python -m unittest discover -s tests -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
