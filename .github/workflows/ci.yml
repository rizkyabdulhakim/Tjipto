name: CI

on:
  pull_request:
  push:

permissions:
  contents: read
  actions: read

jobs:
  dense:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"
      - name: Install dense promotion environment
        run: |
          python -m pip install --require-hashes --upgrade -r requirements.lock
          python -m pip install --require-hashes --no-deps --upgrade --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dense.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Validate current-checkout package origin
        run: python scripts/validate_toolchain.py --package-origin
      - name: Acquire pinned BGE-M3 snapshot
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import snapshot_download

          revision = "5617a9f61b028005a4858fdac845db406aefb181"
          path = snapshot_download("BAAI/bge-m3", revision=revision)
          Path(os.environ["GITHUB_ENV"]).write_text(f"TJIPTO_DENSE_MODEL_DIR={path}\n", encoding="utf-8")
          PY
      - name: Produce exact dense runtime attestation
        run: |
          mkdir -p reports
          python scripts/attest_dense_runtime.py --report reports/dense-promotion-attestation.json
      - name: Upload dense promotion evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dense-promotion-evidence
          path: reports/dense-promotion-attestation.json
          if-no-files-found: error

  backend:
    needs: [dense]
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    outputs:
      artifact_id: ${{ steps.upload_backend.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload_backend.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.14.0"
      - name: Export typed job identity
        run: |
          {
            echo "TJIPTO_JOB_CHECK_RUN_ID=${{ job.check_run_id }}"
            echo "TJIPTO_JOB_WORKFLOW_REF=${{ job.workflow_ref }}"
            echo "TJIPTO_JOB_WORKFLOW_SHA=${{ job.workflow_sha }}"
            echo "TJIPTO_JOB_WORKFLOW_REPOSITORY=${{ job.workflow_repository }}"
            echo "TJIPTO_JOB_WORKFLOW_FILE_PATH=${{ job.workflow_file_path }}"
          } >> "$GITHUB_ENV"
      - name: Install canonical Python environment
        run: |
          python -m pip install --require-hashes --upgrade -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Initialize reports
        run: |
          rm -rf reports
          mkdir reports
      - name: Download exact dense attestation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dense-promotion-evidence
          path: reports
      - name: Validate dense promotion attestation
        run: python scripts/measure_command.py --gate dense_promotion_attestation --report reports/ci-gates.jsonl -- python scripts/attest_dense_runtime.py --check-only --report reports/dense-promotion-attestation.json
      - name: Validate true hybrid activation
        run: python scripts/measure_command.py --gate true_hybrid_activation --report reports/ci-gates.jsonl -- python scripts/attest_dense_runtime.py --check-only --report reports/dense-promotion-attestation.json
      - name: Validate current-checkout package origin
        run: python scripts/measure_command.py --gate package_origin --report reports/ci-gates.jsonl -- python scripts/validate_toolchain.py --package-origin
      - name: Audit hash-pinned dense dependency closure
        run: python scripts/measure_command.py --gate pip_audit --report reports/ci-gates.jsonl -- python -m pip_audit --no-deps --strict -r requirements.lock -r requirements-dense.lock -f json -o reports/pip-audit.json
      - name: Validate canonical toolchain
        run: python scripts/measure_command.py --gate toolchain --report reports/ci-gates.jsonl -- python scripts/validate_toolchain.py
      - name: Record environment identity
        run: python scripts/measure_command.py --environment-report reports/run-identity.json -- python --version
      - name: Compile
        run: python scripts/measure_command.py --gate compileall --report reports/ci-gates.jsonl -- python -m compileall -q src tests scripts
      - name: Unit tests
        run: python scripts/measure_command.py --gate unittest --report reports/ci-gates.jsonl --result-report reports/unittest.json -- python -m unittest discover -s tests -v
      - name: Profile suspected memory owners
        run: |
          for file in \
            tests/test_verified_corpus_contract.py \
            tests/test_uud_builder_contract.py \
            tests/test_raw_source_geometry_contract.py \
            tests/test_pdf_text_span_coverage.py \
            tests/test_runtime_contract.py \
            tests/test_runtime_http_contract.py \
            tests/test_graph_contract.py
          do
            name="$(basename "$file" .py)"
            python scripts/measure_command.py \
              --result-report "reports/memory-${name}.json" \
              -- python -m pytest -q "$file" -p no:cacheprovider
          done
      - name: Profile per-test RSS
        env:
          TJIPTO_MEMORY_REPORT: reports/memory-per-test.json
        run: python -m pytest -q -p no:cacheprovider -p scripts.pytest_memory_profile
      - name: Profile Python allocations
        env:
          TJIPTO_MEMORY_REPORT: reports/memory-python-allocations.json
          TJIPTO_MEMORY_TRACEMALLOC: "1"
        run: |
          python -m pytest -q -p no:cacheprovider -p scripts.pytest_memory_profile \
            tests/test_uud_builder_contract.py::UudBuilderContractTest::test_evidence_rebuild_identity_from_rebuilt_chunks_without_seed \
            tests/test_uud_builder_contract.py::UudBuilderContractTest::test_word_bbox_registry_exists_and_is_deterministic \
            tests/test_source_text_reachability_contract.py::SourceTextReachabilityContractTests::test_evaluator_streams_raw_rows_without_retaining_the_input_owner
      - name: Pytest run 1
        run: python scripts/measure_command.py --gate pytest_run_1 --report reports/ci-gates.jsonl --result-report reports/pytest-run-1.json -- python -m pytest -q -p no:cacheprovider
      - name: Retrieval evaluation
        run: python scripts/measure_command.py --gate retrieval_evaluation --report reports/ci-gates.jsonl --result-report reports/retrieval-evaluation-command.json -- python scripts/evaluate_uud_retrieval.py --strict-known-gaps --report reports/retrieval-evaluation.json
      - name: Research retrieval evaluation
        run: python scripts/measure_command.py --gate research_retrieval_evaluation --report reports/ci-gates.jsonl --result-report reports/research-retrieval-command.json -- python scripts/evaluate_uud_research_retrieval.py --report reports/research-retrieval.json
      - name: Semantic generalization evaluation
        run: python scripts/measure_command.py --gate semantic_generalization_evaluation --report reports/ci-gates.jsonl --result-report reports/semantic-generalization-command.json -- python scripts/evaluate_semantic_generalization.py --report reports/semantic-generalization.json
      - name: Live deployment planner integration
        env:
          TJIPTO_EXTERNAL_RESEARCH_PLANNING: enabled
          TJIPTO_RESEARCH_PLANNING_PROVIDER: openai_compatible
          TJIPTO_RESEARCH_PLANNING_API_KEY: ${{ secrets.TJIPTO_RESEARCH_PLANNING_API_KEY }}
          TJIPTO_RESEARCH_PLANNING_MODEL: ${{ secrets.TJIPTO_RESEARCH_PLANNING_MODEL }}
          TJIPTO_RESEARCH_PLANNING_BASE_URL: ${{ secrets.TJIPTO_RESEARCH_PLANNING_BASE_URL }}
        run: python scripts/measure_command.py --gate live_planner_integration --report reports/ci-gates.jsonl -- python scripts/verify_live_planner.py --report reports/live-planner-integration.json
      - name: Grounded-answer evaluation
        run: python scripts/measure_command.py --gate answer_evaluation --report reports/ci-gates.jsonl --result-report reports/answer-evaluation-command.json -- python scripts/evaluate_uud_answers.py --runtime-commit "$GITHUB_SHA" --report reports/answer-evaluation.json
      - name: Source-text reachability evaluation
        run: python scripts/measure_command.py --gate source_text_evaluation --report reports/ci-gates.jsonl -- python scripts/evaluate_source_text_reachability.py --report reports/source-text-evaluation.json
      - name: Meaningful-support evaluation
        run: python scripts/measure_command.py --gate meaningful_support_evaluation --report reports/ci-gates.jsonl -- python scripts/evaluate_meaningful_support.py --report reports/meaningful-support-evaluation.json
      - name: Support reachability evaluation
        run: python scripts/measure_command.py --gate support_reachability_evaluation --report reports/ci-gates.jsonl -- python scripts/evaluate_support_reachability.py --report reports/support-reachability-evaluation.json
      - name: Artifact validation
        run: python scripts/measure_command.py --gate artifact_validate --report reports/ci-gates.jsonl --result-report reports/artifact-validation.json -- python -m tjipto.corpora.uud_artifact_baseline validate
      - name: Clean exact-head worktree before rebuild
        run: python scripts/measure_command.py --gate clean_tree --report reports/ci-gates.jsonl -- bash -o pipefail -c 'test -z "$(git status --porcelain=v1 --untracked-files=all)"'
      - name: Artifact rebuild
        run: python scripts/measure_command.py --gate artifact_rebuild --report reports/ci-gates.jsonl --result-report reports/artifact-rebuild.json -- python -m tjipto.corpora.uud_artifact_baseline rebuild
      - name: Ruff
        run: python scripts/measure_command.py --gate ruff --report reports/ci-gates.jsonl -- ruff check src tests scripts
      - name: MyPy
        run: python scripts/measure_command.py --gate mypy --report reports/ci-gates.jsonl -- mypy src
      - name: Bandit
        run: python scripts/measure_command.py --gate bandit --report reports/ci-gates.jsonl -- bandit -q -r src
      - name: pip check
        run: python scripts/measure_command.py --gate pip_check --report reports/ci-gates.jsonl -- python -m pip check
      - name: Dependency inspection
        run: python -m pip inspect > reports/pip-inspect.json
      - name: Clean tree after rebuild
        run: |
          git status --porcelain=v1 --untracked-files=all > reports/clean-tree.txt
          test ! -s reports/clean-tree.txt
      - name: Pytest run 2
        run: python scripts/measure_command.py --gate pytest_run_2 --report reports/ci-gates.jsonl --result-report reports/pytest-run-2.json -- python -m pytest -q -p no:cacheprovider
      - name: Compare pytest resource evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.measure_command import compare_pytest_resources

          first = json.loads(Path("reports/pytest-run-1.json").read_text(encoding="utf-8"))
          second = json.loads(Path("reports/pytest-run-2.json").read_text(encoding="utf-8"))
          identity = json.loads(Path("reports/run-identity.json").read_text(encoding="utf-8"))
          comparison = compare_pytest_resources(first, second, identity)
          Path("reports/pytest-resource-comparison.json").write_text(json.dumps(comparison, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          if not all(comparison[key] for key in ("both_pytest_runs_pass", "rss_limit_pass", "rss_stability_pass")):
              raise SystemExit("pytest resource limits exceeded")
          PY
      - name: Verify exact archive (first build)
        run: |
          set -euo pipefail
          python scripts/measure_command.py --gate release_a --report reports/ci-gates.jsonl -- bash -o pipefail -c 'python scripts/verify_clean_handoff.py release "$GITHUB_SHA" "$RUNNER_TEMP/tjipto-release-one.zip" --dense-attestation reports/dense-promotion-attestation.json | tee "$RUNNER_TEMP/tjipto-release-one.json"'
          test -s "$RUNNER_TEMP/tjipto-release-one.json"
          test -s "$RUNNER_TEMP/tjipto-release-one.zip.sidecar.json"
          cp "$RUNNER_TEMP/tjipto-release-one.json" reports/release-one.json
          cp "$RUNNER_TEMP/tjipto-release-one.zip.sidecar.json" reports/release-one.sidecar.json
      - name: Verify exact archive (second build)
        run: |
          set -euo pipefail
          python scripts/measure_command.py --gate release_b --report reports/ci-gates.jsonl -- bash -o pipefail -c 'python scripts/verify_clean_handoff.py release "$GITHUB_SHA" "$RUNNER_TEMP/tjipto-release-two.zip" --dense-attestation reports/dense-promotion-attestation.json | tee "$RUNNER_TEMP/tjipto-release-two.json"'
          test -s "$RUNNER_TEMP/tjipto-release-two.json"
          test -s "$RUNNER_TEMP/tjipto-release-two.zip.sidecar.json"
          cp "$RUNNER_TEMP/tjipto-release-two.json" reports/release-two.json
          cp "$RUNNER_TEMP/tjipto-release-two.zip.sidecar.json" reports/release-two.sidecar.json
      - name: Compare release identities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load_report(path):
              text = Path(path).read_text(encoding="utf-8")
              if not text.strip():
                  raise SystemExit(f"empty release evidence: {path}")
              try:
                  return json.loads(text)
              except json.JSONDecodeError as error:
                  raise SystemExit(f"invalid release evidence: {path}: {error}") from error

          first = load_report("reports/release-one.json")
          second = load_report("reports/release-two.json")
          first_sidecar = load_report("reports/release-one.sidecar.json")
          second_sidecar = load_report("reports/release-two.sidecar.json")
          identity = load_report("reports/run-identity.json")
          comparison = {
              "run_identity_id": identity["run_identity_id"],
              "archive_sha256_equal": first["archive_sha256"] == second["archive_sha256"],
              "corpora_equal": first_sidecar["corpora"] == second_sidecar["corpora"],
              "sidecars_equal": first_sidecar == second_sidecar,
              "forbidden_entry_count": len(first["archive_forbidden_entries"]) + len(second["archive_forbidden_entries"]),
              "first_archive_sha256": first["archive_sha256"],
              "second_archive_sha256": second["archive_sha256"],
              "corpora": first_sidecar["corpora"],
          }
          Path("reports/release-comparison.json").write_text(json.dumps(comparison, indent=2, sort_keys=True) + "\n")
          if not all(comparison[key] for key in ("archive_sha256_equal", "corpora_equal", "sidecars_equal")) or comparison["forbidden_entry_count"]:
              raise SystemExit("release reproducibility comparison failed")
          PY
      - name: Upload backend evidence
        id: upload_backend
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-evidence
          path: reports/
          if-no-files-found: error

  web:
    runs-on: ubuntu-24.04
    outputs:
      artifact_id: ${{ steps.upload_web.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload_web.outputs.artifact-digest }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.14.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Export typed job identity
        run: |
          {
            echo "TJIPTO_JOB_CHECK_RUN_ID=${{ job.check_run_id }}"
            echo "TJIPTO_JOB_WORKFLOW_REF=${{ job.workflow_ref }}"
            echo "TJIPTO_JOB_WORKFLOW_SHA=${{ job.workflow_sha }}"
            echo "TJIPTO_JOB_WORKFLOW_REPOSITORY=${{ job.workflow_repository }}"
            echo "TJIPTO_JOB_WORKFLOW_FILE_PATH=${{ job.workflow_file_path }}"
          } >> "$GITHUB_ENV"
      - name: Install canonical Python environment for smoke
        working-directory: .
        run: |
          python -m pip install --require-hashes --upgrade -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Initialize reports
        run: |
          rm -rf reports
          mkdir reports
      - name: Validate canonical toolchain
        working-directory: .
        run: python scripts/measure_command.py --gate toolchain --report apps/web/reports/ci-gates.jsonl -- python scripts/validate_toolchain.py
      - name: Record run identity
        working-directory: .
        run: python scripts/measure_command.py --environment-report apps/web/reports/run-identity.json -- python --version
      - name: Clean install
        run: npm ci
      - name: Unit tests
        run: python ../../scripts/measure_command.py --gate web_test --report reports/ci-gates.jsonl -- npm run test
      - name: Lint
        run: python ../../scripts/measure_command.py --gate web_lint --report reports/ci-gates.jsonl -- npm run lint
      - name: Typecheck
        run: python ../../scripts/measure_command.py --gate web_typecheck --report reports/ci-gates.jsonl -- npm run typecheck
      - name: Clean build
        run: python ../../scripts/measure_command.py --gate web_build --report reports/ci-gates.jsonl -- npm run build
      - name: Production audit
        run: npm audit --omit=dev --audit-level=high --json > reports/npm-audit.json
      - name: Install browser
        run: npm run smoke:install
      - name: Smoke test
        run: python ../../scripts/measure_command.py --gate web_smoke --report reports/ci-gates.jsonl -- npm run smoke
      - name: Record web environment
        if: always()
        run: |
          node -e "const b=require('./node_modules/playwright-core/browsers.json').browsers.find((x)=>x.name==='chromium'); console.log(JSON.stringify(b))" > reports/browser.json
      - name: Upload web evidence
        id: upload_web
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-evidence
          path: |
            apps/web/reports/
          if-no-files-found: warn

  closure:
    needs: [backend, web]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"
      - name: Export typed job identity
        run: |
          {
            echo "TJIPTO_JOB_CHECK_RUN_ID=${{ job.check_run_id }}"
            echo "TJIPTO_JOB_WORKFLOW_REF=${{ job.workflow_ref }}"
            echo "TJIPTO_JOB_WORKFLOW_SHA=${{ job.workflow_sha }}"
            echo "TJIPTO_JOB_WORKFLOW_REPOSITORY=${{ job.workflow_repository }}"
            echo "TJIPTO_JOB_WORKFLOW_FILE_PATH=${{ job.workflow_file_path }}"
          } >> "$GITHUB_ENV"
      - name: Install canonical Python environment
        run: |
          python -m pip install --require-hashes --upgrade -r requirements.lock
          python -m pip install --no-deps --no-build-isolation -e .
      - name: Record closure job identity
        run: python scripts/measure_command.py --environment-report closure-evidence/closure-run-identity.json -- python --version
      - name: Download backend evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-evidence
          path: closure-evidence/backend
      - name: Download web evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-evidence
          path: closure-evidence/web
      - name: Assemble closure provenance
        if: always()
        run: >-
          python scripts/assemble_closure_provenance.py
          --backend-dir closure-evidence/backend
          --web-dir closure-evidence/web
          --closure-identity closure-evidence/closure-run-identity.json
          --backend-result '${{ needs.backend.result }}'
          --web-result '${{ needs.web.result }}'
          --backend-artifact-id '${{ needs.backend.outputs.artifact_id }}'
          --backend-artifact-digest '${{ needs.backend.outputs.artifact_digest }}'
          --web-artifact-id '${{ needs.web.outputs.artifact_id }}'
          --web-artifact-digest '${{ needs.web.outputs.artifact_digest }}'
          --output closure-evidence/closure-provenance.json
      - name: Upload closure provenance
        id: upload_closure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: closure-provenance
          path: closure-evidence/
          if-no-files-found: error
