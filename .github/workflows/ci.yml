name: CI

on:
  pull_request:
  push:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,static,security]"
      - run: python -m compileall -q src tests scripts
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python -m pytest -q -p no:cacheprovider
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: src:.
      - run: python scripts/evaluate_uud_retrieval.py --strict-known-gaps
      - run: python -m tjipto.corpora.uud_artifact_baseline validate
        env:
          PYTHONPATH: src
      - run: python -m tjipto.corpora.uud_artifact_baseline rebuild
        env:
          PYTHONPATH: src
      - run: git diff --exit-code
      - name: Verify clean archive
        run: python scripts/verify_clean_handoff.py release "$GITHUB_SHA" "$RUNNER_TEMP/tjipto-release.zip"

  runtime-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pip-audit
      - run: python -m venv .venv-runtime-audit
      - run: .venv-runtime-audit/bin/python -m pip install --upgrade pip
      - run: .venv-runtime-audit/bin/python -m pip install "PyMuPDF>=1.27.2,<1.28"
      - run: .venv-runtime-audit/bin/python -m pip check
      - run: python -m pip_audit --path .venv-runtime-audit/lib/python3.12/site-packages --strict -f json -o runtime-pip-audit.json
      - run: .venv-runtime-audit/bin/python -m pip inspect > runtime-pip-inspect.json

  ci-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,static,security]"
      - run: python -m pip uninstall -y tjipto-legal-evidence-engine
      - run: python -m pip check
      - run: python -m pip_audit --local --skip-editable --strict -f json -o ci-pip-audit.json
      - run: python -m pip inspect > ci-pip-inspect.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev
      - run: npm run smoke:install
      - run: npm run smoke
