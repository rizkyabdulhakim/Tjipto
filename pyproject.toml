[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tjipto-legal-evidence-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF==1.27.2.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = [
  "pytest>=9.1,<10",
]
dense = [
  "torch==2.13.0+cpu",
  "transformers==5.15.0",
  "sentencepiece==0.2.1",
]
static = [
  "mypy>=1.19,<2",
  "ruff>=0.8,<1",
]
security = [
  "bandit>=1.9,<2",
  "pip-audit>=2.10,<3",
]

[tool.pytest.ini_options]
markers = [
  "runtime_policy: explicit runtime policy matrix gate",
  "slow: slow tests excluded from the fast default suite",
]

[tool.ruff]
target-version = "py312"
line-length = 140
exclude = [
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  "apps/web/dist",
  "apps/web/node_modules",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
files = [
  "src/tjipto/core/manifest.py",
  "src/tjipto/corpora/reproducibility.py",
  "src/tjipto/evidence/store.py",
  "src/tjipto/ingestion/pdf/health.py",
  "src/tjipto/ingestion/pdf/words.py",
  "src/tjipto/ingestion/pdf/source_documents.py",
  "src/tjipto/runtime/api.py",
  "src/tjipto/runtime/scope_guard.py",
  "src/tjipto/runtime/viewer.py",
]
check_untyped_defs = true
explicit_package_bases = true
ignore_missing_imports = true
namespace_packages = true
warn_unused_configs = true

[tool.bandit]
exclude_dirs = [
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  "apps/web/dist",
  "apps/web/node_modules",
]
skips = ["B101"]
