[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tjipto-legal-evidence-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = ["PyMuPDF"]

[tool.pytest.ini_options]
markers = [
  "runtime_policy: explicit runtime policy matrix gate",
  "slow: slow tests excluded from the fast default suite",
]

[tool.ruff]
target-version = "py311"
line-length = 140
exclude = [
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  "apps/web/dist",
  "apps/web/node_modules",
  "build",
  "dist",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = [
  "src/tjipto/core/manifest.py",
  "src/tjipto/corpora/reproducibility.py",
  "src/tjipto/ingestion/pdf/source_documents.py",
]
explicit_package_bases = true
ignore_missing_imports = true
namespace_packages = true
warn_unused_configs = true

[tool.bandit]
exclude_dirs = [
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  "apps/web/dist",
  "apps/web/node_modules",
]
skips = ["B101"]
