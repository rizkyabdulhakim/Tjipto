[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tjipto-legal-evidence-engine"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = ["PyMuPDF"]

[tool.pytest.ini_options]
markers = [
  "runtime_policy: explicit runtime policy matrix gate",
  "slow: slow tests excluded from the fast default suite",
]
